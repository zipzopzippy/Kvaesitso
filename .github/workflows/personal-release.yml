# Personal build (see MODIFICATIONS.md): builds the "personal" flavor on every push to the
# personal branch and publishes it as a GitHub release.
#
# Signing: release builds are signed with the debug key. To keep updates installable over
# builds made on the PC, the PC's ~/.android/debug.keystore is provided as the base64 encoded
# repository secret DEBUG_KEYSTORE. The workflow fails without it, since an APK signed with the
# runner's own debug key couldn't update an existing install.
name: Personal release

on:
  push:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null

      - name: Restore signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::DEBUG_KEYSTORE secret not set; the APK would not update existing installs"
            exit 1
          fi
          echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/personal.keystore"
          echo "PERSONAL_KEYSTORE=$RUNNER_TEMP/personal.keystore" >> "$GITHUB_ENV"

      - name: Work out version
        id: version
        run: |
          base=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/app/build.gradle.kts | head -1)
          # Incremental, zero padded build number (personal-004, personal-005, ...) so releases
          # sort correctly everywhere. Older releases were named after the commit and count too.
          last=$(git tag --list 'personal-[0-9][0-9][0-9]' | sort | tail -1 | sed 's/^personal-//')
          if [ -n "$last" ]; then
            n=$((10#$last + 1))
          else
            n=$(( $(git tag --list 'personal-*' | wc -l) + 1 ))
          fi
          number=$(printf '%03d' "$n")
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "tag=personal-$number" >> "$GITHUB_OUTPUT"
          echo "version=$base-personal.$number" >> "$GITHUB_OUTPUT"
          echo "sha9=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "PERSONAL_BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          # Don't release the same commit twice (e.g. on a manual re-run).
          if [ -n "$(git tag --points-at HEAD --list 'personal-*')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
          # Date based version code so every build is an update of the previous one.
          echo "VERSION_CODE_OVERRIDE=$(date -u +%Y%m%d%H)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        if: steps.version.outputs.exists != 'true'
        run: ./gradlew :app:app:assemblePersonalRelease --no-daemon

      - name: Check signing certificate
        if: steps.version.outputs.exists != 'true'
        run: |
          # Fail rather than publish an APK that can't update existing installs.
          expected=$(keytool -list -v -keystore "$PERSONAL_KEYSTORE" -storepass android -alias androiddebugkey | sed -n 's/^\s*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          actual=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/app/build/outputs/apk/personal/release/app-personal-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "expected=$expected actual=$actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA9: ${{ steps.version.outputs.sha9 }}
          BASE: ${{ steps.version.outputs.base }}
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          cp app/app/build/outputs/apk/personal/release/app-personal-release.apk Kvaesitso-personal.apk
          sha256=$(sha256sum Kvaesitso-personal.apk | cut -d' ' -f1)
          previous=$(git tag --list 'personal-*' --sort=-creatordate | grep -v "^$TAG$" | head -1)
          if [ -n "$previous" ]; then
            changes=$(git log --no-merges --format='- %s' "$previous..HEAD")
          else
            changes=$(git log --no-merges --format='- %s' -5)
          fi
          cat > notes.md <<EOF
          Personal, modified build of Kvaesitso. Not made or endorsed by the Kvaesitso developers.
          Licensed under the GNU GPL v3; see [MODIFICATIONS.md](https://github.com/${GITHUB_REPOSITORY}/blob/personal/MODIFICATIONS.md) for every change.

          **New in this release:**
          ${changes}

          Installs as "Kvaesitso Personal" (\`de.mm20.launcher2.personal\`) next to the official app, and updates the previous personal build.
          Based on Kvaesitso ${BASE}. Built from branch \`personal\` at ${SHA9}.

          SHA-256: \`${sha256}\`
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" Kvaesitso-personal.apk \
            --target "$GITHUB_SHA" \
            --title "Kvaesitso Personal $NUMBER ($BASE)" \
            --notes-file notes.md \
            --latest
